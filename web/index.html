<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGT Layout Planner</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
    "three/addons/environments/RoomEnvironment.js": "./vendor/RoomEnvironment.js"
  }
}
</script>
</head>
<body>

<header>
  <h1>IGT Layout Planner</h1>
  <div class="grid-facts">
    unit <b>250mm</b> · half <b>125mm</b> · system datum <b id="datum">400mm</b>
    <span class="muted">— all derived, none published</span>
  </div>
</header>

<main>
  <aside id="palette">
    <section>
      <h2>Add a table</h2>
      <div id="add" class="chips"></div>
      <div id="tables" class="parts"></div>
    </section>

    <section class="selbox">
      <h2>Selected <span class="hint" id="selname">nothing selected</span></h2>
      <h3>Legs</h3>
      <div id="legs" class="chips"></div>
      
      
      <h3>Modules</h3>
      <div id="modules" class="parts"></div>
    </section>
  </aside>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="slotbar" title="half-slot occupancy of the selected frame"></div>
    <div id="hint">drag a table to move it — it snaps flush · drag a module along its rail</div>
  </div>

  <aside id="bom">
    <h2>Build</h2>
    <div id="warnings"></div>
    <table id="bomtable"></table>
    <div id="totals"></div>
  </aside>
</main>

<script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGT Layout Planner</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
    "three/addons/environments/RoomEnvironment.js": "./vendor/RoomEnvironment.js"
  }
}
</script>
</head>
<body>

<header>
  <h1>IGT Layout Planner</h1>
  <div class="grid-facts">
    unit <b>250mm</b> · half <b>125mm</b> · system datum <b id="datum">400mm</b>
    <span class="muted">— all derived, none published · <a href="part.html">part bench</a></span>
  </div>
  <button id="theme" class="chip" title="light / dark theme">☾</button>
</header>

<main>
  <aside id="palette">
    <section>
      <h2>Add a table</h2>
      <div id="add" class="chips"></div>
      <div id="tables" class="parts"></div>
    </section>

    <section class="selbox">
      <h2>Selected <span class="hint" id="selname">nothing selected</span></h2>
      <h3>Legs</h3>
      <div id="legs" class="chips"></div>

      <h3>Modules</h3>
      <div id="modules" class="parts"></div>

      <h3>Actions</h3>
      <div id="actions" class="chips"></div>
    </section>
  </aside>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="slotbar" title="half-slot occupancy of the selected frame"></div>

    <!-- The edge affordance. It only ever appears where there is really a hole to hook
         into: the frame's two short ends, or the bracket edge of a board already hooked
         on. Nowhere along a rail, because there is nothing along a rail to hook to. -->
    <button id="edgebtn" hidden>+</button>
    <div id="edgemenu" hidden></div>

    <!-- A hover preview for a menu row: thumbnail + the details that don't fit in the row. -->
    <div id="preview" hidden></div>

    <div id="hint">hover a table <b>edge</b> to hook on an extension · hover <b>inside a frame</b> to drop in a module · drag a table to move it</div>
  </div>

  <aside id="bom">
    <h2>Build</h2>
    <div id="warnings"></div>
    <table id="bomtable"></table>
    <div id="totals"></div>
  </aside>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
